<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>KineticVerse AR - Quantum Physics Sandbox</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #020208;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
    }
    #camera-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }
    /* Intro Overlay Screen */
    #start-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #0d0e26 0%, #020208 100%);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
    }
    .title-glow {
      font-size: 2.4rem;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #00c6ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .subtitle {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 32px;
      max-width: 300px;
      line-height: 1.4;
    }
    .start-btn {
      padding: 18px 42px;
      font-size: 1.1rem;
      font-weight: 700;
      color: #020208;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      border: none;
      border-radius: 50px;
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.4);
      cursor: pointer;
      letter-spacing: 1px;
    }
    /* Glassmorphism Heads-Up Display */
    .hud-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: #38bdf8;
      border-radius: 50%;
      box-shadow: 0 0 8px #38bdf8;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .hud-controls {
      pointer-events: auto;
      display: flex;
      gap: 10px;
    }
    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      cursor: pointer;
    }
    .icon-btn.active {
      background: rgba(56, 189, 248, 0.3);
      border-color: #38bdf8;
      color: #38bdf8;
    }
    /* Bottom Navigation Bar */
    .hud-bottom {
      pointer-events: auto;
      display: flex;
      justify-content: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 8px;
      border-radius: 30px;
      margin: 0 auto;
      max-width: 360px;
      width: 100%;
    }
    .mode-btn {
      flex: 1;
      padding: 10px 0;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 0.75rem;
      font-weight: 700;
      border-radius: 20px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
    }
    .mode-btn.active {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      color: #020208;
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.3);
    }
  </style>
</head>
<body>

  <!-- Background Camera Feed for AR -->
  <video id="camera-video" playsinline autoplay muted></video>

  <!-- 3D Canvas Layer -->
  <div id="canvas-container"></div>

  <!-- Entry Overlay -->
  <div id="start-overlay">
    <div class="title-glow">KineticVerse</div>
    <div class="subtitle">Interactive Spatial Quantum Engine.<br/>Shake device or touch screen to activate real-time audio-visual dynamics.</div>
    <button class="start-btn" id="start-btn">INITIALIZE EXPERIENCE</button>
  </div>

  <!-- Heads Up Display -->
  <div class="hud-layer">
    <div class="hud-top">
      <div class="badge">
        <div class="pulse-dot"></div>
        <span id="status-text">SENSOR ACTIVE</span>
      </div>
      <div class="hud-controls">
        <button class="icon-btn" id="ar-toggle-btn" title="Toggle AR Mode">AR</button>
        <button class="icon-btn" id="audio-toggle-btn" title="Toggle Sound">🔊</button>
      </div>
    </div>

    <div class="hud-bottom">
      <button class="mode-btn active" data-mode="bloom">Bloom</button>
      <button class="mode-btn" data-mode="plasma">Plasma</button>
      <button class="mode-btn" data-mode="stellar">Stellar</button>
    </div>
  </div>

  <!-- Three.js Graphics Library from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    // System Variables & Controls
    const particleCount = 12000;
    let scene, camera, renderer, particleSystem, geometry, positions, colors, velocities;
    let audioCtx = null, synthOsc = null, synthGain = null;
    let isAudioEnabled = true, isArEnabled = false, cameraStream = null;
    let currentMode = 'bloom';
    
    // Motion Variables
    let lastX = 0, lastY = 0, lastZ = 0;
    let shakeSensitivity = 14;
    let touchX = 0, touchY = 0, isTouching = false;

    // Element References
    const overlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('start-btn');
    const arBtn = document.getElementById('ar-toggle-btn');
    const audioBtn = document.getElementById('audio-toggle-btn');
    const cameraVideo = document.getElementById('camera-video');
    const modeButtons = document.querySelectorAll('.mode-btn');

    // Color Schematics for Simulation Modes
    const themes = {
      bloom: { primary: [0.0, 0.95, 0.99], secondary: [0.2, 0.4, 1.0] },
      plasma: { primary: [0.99, 0.0, 0.5], secondary: [0.5, 0.0, 0.99] },
      stellar: { primary: [1.0, 0.7, 0.0], secondary: [1.0, 0.2, 0.0] }
    };

    // Entry Point Initialization
    startBtn.addEventListener('click', async () => {
      // 1. Initialize Motion Sensors
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        try {
          const permission = await DeviceMotionEvent.requestPermission();
          if (permission === 'granted') listenToMotion();
        } catch (e) { console.error(e); }
      } else {
        listenToMotion();
      }

      // 2. Initialize Web Audio Synthesizer
      initAudio();

      // 3. Setup Three.js Engine
      initThreeJS();

      // Hide Overlay
      overlay.style.display = 'none';
    });

    // Device Motion & Sensor Listener
    function listenToMotion() {
      window.addEventListener('devicemotion', (e) => {
        const acc = e.accelerationIncludingGravity;
        if (!acc) return;

        let deltaX = Math.abs(acc.x - lastX);
        let deltaY = Math.abs(acc.y - lastY);
        let deltaZ = Math.abs(acc.z - lastZ);
        let totalForce = deltaX + deltaY + deltaZ;

        if (totalForce > shakeSensitivity) {
          triggerShakeExplosion(totalForce);
        }

        lastX = acc.x; lastY = acc.y; lastZ = acc.z;
      });

      // Gyroscope orientation for subtle gravity shifts
      window.addEventListener('deviceorientation', (e) => {
        if (!particleSystem) return;
        if (e.gamma && e.beta) {
          particleSystem.rotation.y = (e.gamma * Math.PI) / 180;
          particleSystem.rotation.x = (e.beta * Math.PI) / 180;
        }
      });
    }

    // Audio Synthesizer
    function initAudio() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
        synthGain = audioCtx.createGain();
        synthGain.gain.setValueAtTime(0.01, audioCtx.currentTime);
        synthGain.connect(audioCtx.destination);
      } catch(e) { console.error(e); }
    }

    function triggerSynthesizerPulse(frequency, duration = 0.2) {
      if (!isAudioEnabled || !audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = currentMode === 'bloom' ? 'sine' : currentMode === 'plasma' ? 'sawtooth' : 'triangle';
      osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(frequency * 0.3, audioCtx.currentTime + duration);

      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

      osc.connect(gain);
      gain.connect(synthGain);

      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    // Three.js 3D Particle Physics Setup
    function initThreeJS() {
      const container = document.getElementById('canvas-container');
      
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 80;

      renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      geometry = new THREE.BufferGeometry();
      positions = new Float32Array(particleCount * 3);
      colors = new Float32Array(particleCount * 3);
      velocities = new Float32Array(particleCount * 3);

      resetParticles();

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      // Circular glowing particle texture generator
      const canvas = document.createElement('canvas');
      canvas.width = 32; canvas.height = 32;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
      grad.addColorStop(0, 'rgba(255,255,255,1)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 32, 32);
      const texture = new THREE.Texture(canvas);
      texture.needsUpdate = true;

      const material = new THREE.PointsMaterial({
        size: 1.5,
        vertexColors: true,
        map: texture,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      particleSystem = new THREE.Points(geometry, material);
      scene.add(particleSystem);

      // Event Listeners for Touch and Resizing
      window.addEventListener('resize', onWindowResize);
      setupTouchEvents();

      // Render Loop
      animate();
    }

    function resetParticles() {
      const theme = themes[currentMode];
      for (let i = 0; i < particleCount * 3; i += 3) {
        positions[i] = (Math.random() - 0.5) * 60;
        positions[i + 1] = (Math.random() - 0.5) * 60;
        positions[i + 2] = (Math.random() - 0.5) * 60;

        velocities[i] = (Math.random() - 0.5) * 0.1;
        velocities[i + 1] = (Math.random() - 0.5) * 0.1;
        velocities[i + 2] = (Math.random() - 0.5) * 0.1;

        let ratio = Math.random();
        colors[i] = theme.primary[0] * ratio + theme.secondary[0] * (1 - ratio);
        colors[i + 1] = theme.primary[1] * ratio + theme.secondary[1] * (1 - ratio);
        colors[i + 2] = theme.primary[2] * ratio + theme.secondary[2] * (1 - ratio);
      }
      if (geometry) {
        geometry.attributes.position.needsUpdate = true;
        geometry.attributes.color.needsUpdate = true;
      }
    }

    // Dynamic Physics Motion Loop
    function animate() {
      requestAnimationFrame(animate);

      const posAttr = geometry.attributes.position;
      const posArray = posAttr.array;

      for (let i = 0; i < particleCount * 3; i += 3) {
        // Apply position update based on velocity vectors
        posArray[i] += velocities[i];
        posArray[i + 1] += velocities[i + 1];
        posArray[i + 2] += velocities[i + 2];

        // Drag dampening factor
        velocities[i] *= 0.96;
        velocities[i + 1] *= 0.96;
        velocities[i + 2] *= 0.96;

        // Central vortex pull back
        posArray[i] *= 0.995;
        posArray[i + 1] *= 0.995;
        posArray[i + 2] *= 0.995;
      }

      posAttr.needsUpdate = true;
      particleSystem.rotation.z += 0.001;

      renderer.render(scene, camera);
    }

    // Shake Trigger Physics Handler
    function triggerShakeExplosion(force) {
      const posArray = geometry.attributes.position.array;
      const multiplier = Math.min(force * 0.08, 3.5);

      for (let i = 0; i < particleCount * 3; i += 3) {
        velocities[i] += (Math.random() - 0.5) * multiplier;
        velocities[i + 1] += (Math.random() - 0.5) * multiplier;
        velocities[i + 2] += (Math.random() - 0.5) * multiplier;
      }

      // Android Haptic Vibration
      if (navigator.vibrate) navigator.vibrate([30, 20, 50]);

      // Sound Wave Synthesis Trigger
      triggerSynthesizerPulse(150 + force * 15, 0.35);
    }

    // Touch & Interactive Physics Setup
    function setupTouchEvents() {
      window.addEventListener('pointerdown', (e) => {
        isTouching = true;
        handleTouchForce(e);
      });
      window.addEventListener('pointermove', (e) => {
        if (isTouching) handleTouchForce(e);
      });
      window.addEventListener('pointerup', () => { isTouching = false; });
    }

    function handleTouchForce(e) {
      const vector = new THREE.Vector3(
        (e.clientX / window.innerWidth) * 2 - 1,
        -(e.clientY / window.innerHeight) * 2 + 1,
        0.5
      );
      vector.unproject(camera);
      const dir = vector.sub(camera.position).normalize();
      const distance = -camera.position.z / dir.z;
      const pos = camera.position.clone().add(dir.multiplyScalar(distance));

      const posArray = geometry.attributes.position.array;
      for (let i = 0; i < particleCount * 3; i += 3) {
        let dx = posArray[i] - pos.x;
        let dy = posArray[i + 1] - pos.y;
        let dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 25) {
          velocities[i] += (dx / dist) * 0.8;
          velocities[i + 1] += (dy / dist) * 0.8;
        }
      }

      if (navigator.vibrate) navigator.vibrate(15);
      triggerSynthesizerPulse(300 + (e.clientY / window.innerHeight) * 400, 0.1);
    }

    // AR Camera Pass-Through Control
    arBtn.addEventListener('click', async () => {
      isArEnabled = !isArEnabled;
      if (isArEnabled) {
        try {
          cameraStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment' }
          });
          cameraVideo.srcObject = cameraStream;
          cameraVideo.style.opacity = '1';
          arBtn.classList.add('active');
        } catch(e) {
          alert('Camera access unavailable for AR pass-through.');
          isArEnabled = false;
        }
      } else {
        if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
        cameraVideo.style.opacity = '0';
        arBtn.classList.remove('active');
      }
    });

    // Audio Mute/Unmute Toggle
    audioBtn.addEventListener('click', () => {
      isAudioEnabled = !isAudioEnabled;
      audioBtn.classList.toggle('active', isAudioEnabled);
      audioBtn.textContent = isAudioEnabled ? '🔊' : '🔇';
    });

    // Simulation Mode Switcher
    modeButtons.forEach(btn => {
      btn.addEventListener('click', (e) => {
        modeButtons.forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentMode = e.target.dataset.mode;
        resetParticles();
        triggerSynthesizerPulse(500, 0.2);
      });
    });

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  </script>
</body>
</html>
