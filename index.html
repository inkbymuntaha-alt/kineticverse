<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>KineticVerse AR</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #camera-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: auto;
    }
    #debug-console {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      max-height: 25vh;
      background: rgba(0, 0, 0, 0.85);
      color: #00ffcc;
      font-family: monospace;
      font-size: 11px;
      padding: 8px;
      box-sizing: border-box;
      overflow-y: auto;
      z-index: 99999;
      pointer-events: none;
      border-top: 1px solid #333;
    }
    #debug-logs div {
      padding: 2px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>

  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- Camera Pass-Through Video Element -->
  <video id="camera-video" autoplay playsinline muted></video>

  <!-- WebGL Render Canvas Container -->
  <div id="canvas-container"></div>

  <!-- On-Screen Debugger for Mobile Logs -->
  <div id="debug-console">
    <div style="font-weight: bold; border-bottom: 1px solid #555; margin-bottom: 4px; color: #fff;">System Debug Logs:</div>
    <div id="debug-logs"></div>
  </div>

  <script>
    // --- 1. FLOATING DEBUG LOG SYSTEM ---
    (function() {
      const logContainer = document.getElementById('debug-logs');
      function appendLog(type, args) {
        const msg = Array.from(args).map(arg => 
          typeof arg === 'object' ? JSON.stringify(arg) : arg
        ).join(' ');
        const div = document.createElement('div');
        div.style.color = type === 'error' ? '#ff4444' : (type === 'warn' ? '#ffff00' : '#00ffcc');
        div.textContent = `[${new Date().toLocaleTimeString().split(' ')[0]}] ${msg}`;
        logContainer.appendChild(div);
        logContainer.scrollTop = logContainer.scrollHeight;
      }
      const origLog = console.log, origErr = console.error, origWarn = console.warn;
      console.log = function(...a) { origLog.apply(console, a); appendLog('log', a); };
      console.error = function(...a) { origErr.apply(console, a); appendLog('error', a); };
      console.warn = function(...a) { origWarn.apply(console, a); appendLog('warn', a); };
      window.addEventListener('error', e => appendLog('error', `${e.message} (${e.filename}:${e.lineno})`));
    })();

    console.log("Auto-booting KineticVerse AR...");

    let audioCtx = null, scene, camera, renderer, particleMesh;
    let velocities = [], motionX = 0, motionY = 0;
    const count = 500;

    // --- 2. AUDIO SYNTHESIZER ---
    function initAudio() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
          audioCtx = new AudioContext();
          if (audioCtx.state === 'suspended') audioCtx.resume();
          console.log("Audio Context ready.");
        }
      } catch(e) {
        console.warn("Web Audio fallback:", e.message);
      }
    }

    function playSynthTone(freq) {
      if (!audioCtx || audioCtx.state !== 'running') return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } catch(e) {}
    }

    // --- 3. CAMERA PASS-THROUGH (NON-BLOCKING) ---
    function initCameraNonBlocking() {
      const video = document.getElementById('camera-video');
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        console.warn("Camera API missing or blocked.");
        return;
      }
      navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false })
        .then(stream => {
          video.srcObject = stream;
          video.play().catch(e => console.warn("Video play warning:", e.message));
          console.log("Camera pass-through active!");
        })
        .catch(err => {
          console.warn("Camera bypassed or denied:", err.message);
        });
    }

    // --- 4. DEVICE MOTION ---
    function initSensors() {
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        DeviceMotionEvent.requestPermission().then(state => {
          if (state === 'granted') window.addEventListener('devicemotion', handleMotion);
        }).catch(e => console.warn("Motion permission warning:", e.message));
      } else if ('DeviceMotionEvent' in window) {
        window.addEventListener('devicemotion', handleMotion);
        console.log("Listening to Motion events.");
      }
    }

    function handleMotion(e) {
      if (e.accelerationIncludingGravity) {
        motionX = (e.accelerationIncludingGravity.x || 0) * 0.05;
        motionY = (e.accelerationIncludingGravity.y || 0) * 0.05;
      }
    }

    // --- 5. THREE.JS WebGL SCENE ---
    function initThreeJS() {
      const container = document.getElementById('canvas-container');
      if (!container) return;
      
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 15;

      renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      const geometry = new THREE.BufferGeometry();
      const posArray = new Float32Array(count * 3);

      for(let i = 0; i < count * 3; i += 3) {
        posArray[i] = (Math.random() - 0.5) * 20;
        posArray[i+1] = (Math.random() - 0.5) * 20;
        posArray[i+2] = (Math.random() - 0.5) * 10;

        velocities.push({
          x: (Math.random() - 0.5) * 0.02,
          y: (Math.random() - 0.5) * 0.02,
          z: (Math.random() - 0.5) * 0.02
        });
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
      const material = new THREE.PointsMaterial({
        size: 0.35,
        color: 0x00ffcc,
        transparent: true,
        opacity: 0.8,
        blending: THREE.AdditiveBlending
      });

      particleMesh = new THREE.Points(geometry, material);
      scene.add(particleMesh);

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // Enable touch tones after user interaction anywhere on screen
      window.addEventListener('touchstart', () => {
        initAudio();
        playSynthTone(440 + Math.random() * 220);
      }, { once: false });

      animate();
      console.log("3D Canvas active!");
    }

    function animate() {
      requestAnimationFrame(animate);
      if (particleMesh) {
        const positionsArr = particleMesh.geometry.attributes.position.array;
        for (let i = 0; i < count; i++) {
          const idx = i * 3;
          positionsArr[idx] += velocities[i].x + motionX * 0.02;
          positionsArr[idx + 1] += velocities[i].y - motionY * 0.02;
          positionsArr[idx + 2] += velocities[i].z;

          if (Math.abs(positionsArr[idx]) > 10) velocities[i].x *= -1;
          if (Math.abs(positionsArr[idx + 1]) > 10) velocities[i].y *= -1;
          if (Math.abs(positionsArr[idx + 2]) > 5) velocities[i].z *= -1;
        }
        particleMesh.geometry.attributes.position.needsUpdate = true;
        particleMesh.rotation.y += 0.002;
      }
      renderer.render(scene, camera);
    }

    // --- AUTOMATIC LOAD ---
    window.onload = function() {
      initThreeJS();
      initSensors();
      initCameraNonBlocking();
    };
  </script>
</body>
</html>
