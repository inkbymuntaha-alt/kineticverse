<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>KineticVerse AR</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #camera-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: auto;
    }
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(5, 5, 10, 0.85);
      backdrop-filter: blur(8px);
      transition: opacity 0.5s ease;
    }
    #ui-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .title {
      color: #fff;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 8px;
      text-transform: uppercase;
      background: linear-gradient(45deg, #00ffff, #ff00ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      color: #aaa;
      font-size: 13px;
      margin-bottom: 24px;
      text-align: center;
      padding: 0 20px;
    }
    .btn-init {
      background: linear-gradient(135deg, #00ffcc, #0077ff);
      color: #000;
      font-weight: bold;
      border: none;
      padding: 14px 28px;
      font-size: 14px;
      border-radius: 30px;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 255, 204, 0.4);
    }
    #debug-console {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      max-height: 35vh;
      background: rgba(0, 0, 0, 0.85);
      color: #00ffcc;
      font-family: monospace;
      font-size: 11px;
      padding: 8px;
      box-sizing: border-box;
      overflow-y: auto;
      z-index: 99999;
      pointer-events: none;
      border-top: 1px solid #333;
    }
    #debug-logs div {
      padding: 2px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>

  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- Camera Pass-Through Video Element -->
  <video id="camera-video" autoplay playsinline muted></video>

  <!-- WebGL Render Canvas Container -->
  <div id="canvas-container"></div>

  <!-- User Gesture Activation Overlay -->
  <div id="ui-overlay">
    <div class="title">KineticVerse</div>
    <div class="subtitle">Mobile AR & Physics Motion Experience</div>
    <button class="btn-init" id="start-btn">INITIALIZE EXPERIENCE</button>
  </div>

  <!-- On-Screen Debugger for Mobile Logs -->
  <div id="debug-console">
    <div style="font-weight: bold; border-bottom: 1px solid #555; margin-bottom: 4px; color: #fff;">System Debug Logs:</div>
    <div id="debug-logs"></div>
  </div>

  <script>
    // --- 1. FLOATING DEBUG LOG SYSTEM ---
    (function() {
      const logContainer = document.getElementById('debug-logs');
      function appendLog(type, args) {
        const msg = Array.from(args).map(arg => 
          typeof arg === 'object' ? JSON.stringify(arg) : arg
        ).join(' ');
        const div = document.createElement('div');
        div.style.color = type === 'error' ? '#ff4444' : (type === 'warn' ? '#ffff00' : '#00ffcc');
        div.textContent = `[${new Date().toLocaleTimeString().split(' ')[0]}] ${msg}`;
        logContainer.appendChild(div);
        logContainer.scrollTop = logContainer.scrollHeight;
      }
      const origLog = console.log, origErr = console.error, origWarn = console.warn;
      console.log = function(...a) { origLog.apply(console, a); appendLog('log', a); };
      console.error = function(...a) { origErr.apply(console, a); appendLog('error', a); };
      console.warn = function(...a) { origWarn.apply(console, a); appendLog('warn', a); };
      window.addEventListener('error', e => appendLog('error', `${e.message} (${e.filename}:${e.lineno})`));
    })();

    console.log("App ready. Tap initialize button.");

    // --- 2. GLOBAL STATE & WEB AUDIO SYNTHESIZER ---
    let audioCtx = null;
    let scene, camera, renderer, particleMesh;
    let velocities = [], positions = [];
    let motionX = 0, motionY = 0;
    const count = 500;

    function initAudio() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
        console.log("AudioContext state:", audioCtx.state);
      } catch(e) {
        console.error("Web Audio API not supported on this browser:", e);
      }
    }

    function playSynthTone(freq) {
      if (!audioCtx || audioCtx.state !== 'running') return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.3);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    }

    // --- 3. CAMERA PASS-THROUGH SETUP ---
    async function initCamera() {
      const video = document.getElementById('camera-video');
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        console.error("getUserMedia API is not supported on this browser.");
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        console.log("Camera pass-through active.");
      } catch (err) {
        console.error("Camera access error:", err.name, err.message);
      }
    }

    // --- 4. DEVICE MOTION & ORIENTATION ---
    function initSensors() {
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        // iOS 13+ permission request
        DeviceMotionEvent.requestPermission().then(state => {
          if (state === 'granted') {
            window.addEventListener('devicemotion', handleMotion);
            console.log("Motion sensor granted.");
          } else {
            console.warn("Motion sensor access denied.");
          }
        }).catch(console.error);
      } else if ('DeviceMotionEvent' in window) {
        // Android and standard desktop browsers
        window.addEventListener('devicemotion', handleMotion);
        console.log("Listening to DeviceMotion events.");
      } else {
        console.warn("DeviceMotion API not available on this device.");
      }
    }

    function handleMotion(e) {
      if (e.accelerationIncludingGravity) {
        motionX = (e.accelerationIncludingGravity.x || 0) * 0.05;
        motionY = (e.accelerationIncludingGravity.y || 0) * 0.05;
      }
    }

    // --- 5. THREE.JS SCENE SETUP ---
    function initThreeJS() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 15;

      renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      // Create interactive particle field
      const geometry = new THREE.BufferGeometry();
      const posArray = new Float32Array(count * 3);

      for(let i = 0; i < count * 3; i += 3) {
        posArray[i] = (Math.random() - 0.5) * 20;
        posArray[i+1] = (Math.random() - 0.5) * 20;
        posArray[i+2] = (Math.random() - 0.5) * 10;

        velocities.push({
          x: (Math.random() - 0.5) * 0.02,
          y: (Math.random() - 0.5) * 0.02,
          z: (Math.random() - 0.5) * 0.02
        });
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));

      const material = new THREE.PointsMaterial({
        size: 0.35,
        color: 0x00ffcc,
        transparent: true,
        opacity: 0.8,
        blending: THREE.AdditiveBlending
      });

      particleMesh = new THREE.Points(geometry, material);
      scene.add(particleMesh);

      // Handle screen resize
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // Touch interaction trigger
      window.addEventListener('touchstart', () => {
        playSynthTone(440 + Math.random() * 220);
      });

      animate();
      console.log("Three.js WebGL scene created.");
    }

    function animate() {
      requestAnimationFrame(animate);

      if (particleMesh) {
        const positionsArr = particleMesh.geometry.attributes.position.array;

        for (let i = 0; i < count; i++) {
          const idx = i * 3;

          // Apply sensor velocity
          positionsArr[idx] += velocities[i].x + motionX * 0.02;
          positionsArr[idx + 1] += velocities[i].y - motionY * 0.02;
          positionsArr[idx + 2] += velocities[i].z;

          // Screen boundaries reflection
          if (Math.abs(positionsArr[idx]) > 10) velocities[i].x *= -1;
          if (Math.abs(positionsArr[idx + 1]) > 10) velocities[i].y *= -1;
          if (Math.abs(positionsArr[idx + 2]) > 5) velocities[i].z *= -1;
        }

        particleMesh.geometry.attributes.position.needsUpdate = true;
        particleMesh.rotation.y += 0.002;
      }

      renderer.render(scene, camera);
    }

    // --- 6. INITIALIZATION EVENT TRIGGER ---
    document.getElementById('start-btn').addEventListener('click', async () => {
      console.log("Initializing experience...");
      
      initAudio();
      if (audioCtx && audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }

      await initCamera();
      initSensors();
      initThreeJS();

      // Hide overlay
      const overlay = document.getElementById('ui-overlay');
      overlay.classList.add('hidden');
      console.log("KineticVerse active!");
    });
  </script>
</body>
</html>
